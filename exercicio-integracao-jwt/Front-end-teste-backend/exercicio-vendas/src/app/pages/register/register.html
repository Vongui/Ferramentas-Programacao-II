<p>Registro de Usuário</p>

<form [formGroup]="form" (ngSubmit)="register()">
  <div>
    <label for="login">E-mail</label>
    <input id="login" type="email" formControlName="login" />
  </div>

  <div>
    <label for="senha">Senha</label>
    <input id="senha" type="password" formControlName="password" />
  </div>

  <div>
    <label for="perfil">Perfil do Usuário</label>
    <select id="perfil" formControlName="role">
      <option [ngValue]="UserRole.USER">Usuário Comum</option>
      <option [ngValue]="UserRole.ADMIN">Administrador</option>
    </select>
  </div>

  @if (error()) {
    <div>
      <span>{{ error() }}</span>
    </div>
  }

  <button type="submit" [disabled]="form.invalid">Cadastrar</button>
  
  <button type="button" routerLink="/login">Já tenho uma conta</button>
</form>
