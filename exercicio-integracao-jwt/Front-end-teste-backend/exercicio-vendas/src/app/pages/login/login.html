<p>Login</p>
<form [formGroup]="form" (ngSubmit)="login()">
  <div>
    <label for="login">Login</label>
    <input id="login" type="text" formControlName="login" />
  </div>
  <div>
    <label for="senha">Senha</label>
    <input id="senha" type="password" formControlName="password" />
  </div>
  @if (error()) {
    <div>
      <span>{{ error() }}</span>
    </div>
  }
  <button type="submit">Login</button>
  <button type="button" routerLink="/register">Registre-se</button>
  <button type="button" routerLink="/pagina-publica">Pública</button>
  <button type="button" (click)="sair()">Logout</button>
</form>
