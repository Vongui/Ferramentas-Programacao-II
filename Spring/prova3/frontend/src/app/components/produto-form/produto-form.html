<div class="card max-w-2xl mx-auto mt-10 p-6 bg-gray-900 border border-gray-800 rounded-lg shadow-xl">

  <h2 class="text-2xl font-bold mb-6 text-white">
    {{ isEdicao ? 'Editar Produto' : 'Novo Produto' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="salvar()" class="flex flex-col gap-5">

    <div class="flex flex-col gap-2">
      <label for="descricao" class="text-gray-300 font-medium">Descrição</label>
      <input
        id="descricao"
        type="text"
        pInputText
        formControlName="descricao"
        class="w-full"
        placeholder="Digite o nome do produto"
      />
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div class="flex flex-col gap-2">
        <label for="preco" class="text-gray-300 font-medium">Preço</label>
        <p-inputNumber
          inputId="preco"
          formControlName="preco"
          mode="currency"
          currency="BRL"
          locale="pt-BR"
          styleClass="w-full">
        </p-inputNumber>
      </div>

      <div class="flex flex-col gap-2">
        <label for="quantidade" class="text-gray-300 font-medium">Quantidade</label>
        <p-inputNumber
          inputId="quantidade"
          formControlName="quantidade"
          styleClass="w-full">
        </p-inputNumber>
      </div>
    </div>

    <!-- <div class="flex flex-col gap-2">
      <label for="status" class="text-gray-300 font-medium">Status</label>
      <p-selectButton
        [options]="statusOptions"
        formControlName="status"
        optionLabel="label"
        optionValue="value">
      </p-selectButton>
    </div> -->

    <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-800">
      <p-button
        label="Cancelar"
        severity="secondary"
        [outlined]="true"
        (onClick)="voltar()">
      </p-button>

      <p-button
        label="Salvar"
        type="submit"
        severity="success"
        [disabled]="form.invalid">
      </p-button>
    </div>

  </form>
</div>
