<div class="card">
  <p-table
    #dt
    [value]="(produtos$ | async)!"
    [paginator]="true"
    [rows]="5"
    stripedRows
    [showCurrentPageReport]="true"
    [tableStyle]="{ 'min-width': '50rem' }"
    currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} produtos"
    [rowsPerPageOptions]="[5, 10, 15]"
    sortMode="multiple",
    [globalFilterFields]="['id', 'descricao', 'preco', 'quantidade']"
  >
    <ng-template #caption>
      <div class="flex items-center justify-between w-full">
        <div class="flex items-center gap-4">
          <span class="text-xl font-bold">Lista de Produtos</span>
          <p-button
            label="Novo Produto"
            icon="pi pi-plus"
            size="small"
            (onClick)="novoProduto()">
          </p-button>
        </div>

        <p-icon-field iconPosition="left" class="w-64">
          <p-inputicon>
            <i class="pi pi-search"></i>
          </p-inputicon>
          <input
            pInputText
            type="text"
            class="w-full pl-10"
            (input)="dt.filterGlobal($event.target.value, 'contains')"
            placeholder="Procure por Palavras-Chave"
          />
        </p-icon-field>
      </div>
    </ng-template>

    <ng-template #header>
      <tr>
        <th pSortableColumn="id" style="width:15%">
          Código
          <p-sortIcon field="id"/>
        </th>

        <th style="width:25%">
          Descricao
        </th>

        <th pSortableColumn="preco" style="width:15%">
          Preço
          <p-sortIcon field="preco" />
        </th>

        <th style="width:15%">
          Quantidade
        </th>

        <th pSortableColumn="status" style="width:15%">
          Status
          <p-sortIcon field="status" />
        </th>

        <th style="width:15%; text-align: center;">
          Ações
        </th>
      </tr>
    </ng-template>

    <ng-template #body let-produto>
      <tr>
        <td>{{ produto.id }}</td>
        <td>{{ produto.descricao }}</td>
        <td>{{ produto.preco | currency:'BRL' }}</td>
        <td>{{ produto.quantidade }}</td>
        <td>{{ produto.status }}</td>
        <td>
          <div class="flex justify-center gap-2">
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [rounded]="true"
              [text]="true"
              (onClick)="alterar(produto)">
            </p-button>

            <p-button
              icon="pi pi-trash"
              severity="danger"
              [rounded]="true"
              [text]="true"
              (onClick)="excluir(produto)">
            </p-button>
          </div>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
